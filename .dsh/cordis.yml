# 项目级 DSH 插件配置 (cordis 加载层)。
# ⚠️ cordis 配置不会被自动发现: 启动 DSH 时需显式指定, 例如
#     dsh --config .dsh\cordis.yml        (相对 cwd 解析, 见 app-boot resolveConfigPath)
#
# MCP 服务器经 @deepseek-ai/dsh-mcp-client 挂载, 工具名形如 mcp__memory__xxx。
#
# 注意:
# - stdio 传输在 Windows 上 spawn 的是 .cmd 垫片, 必须经 cmd /c 中转
# - MEMORY_FILE_PATH 把记忆持久化到用户目录, 跨会话保留 (跨 agent 交接的事实沉淀)
# - GhidraMCP (LaurieWired/GhidraMCP): 需要本机跑 Ghidra + 安装其插件后才有价值;
#   启用方式 = 在 Ghidra 里开 bridge, 然后仿照下面条目加:
#     transport: streamable-http / url: http://127.0.0.1:8080/sse (以该插件 README 为准)
- id: mcp-memory
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: memory
    transport: stdio
    command: cmd
    args: ['/c', 'npx', '-y', '@modelcontextprotocol/server-memory']
    env:
      MEMORY_FILE_PATH: 'C:\Users\Administrator\.dsh\memory\pecmd-knowledge.json'

# GhidraMCP (bethington/ghidra-mcp v6.0.0, 272 tools) — 按地址查反编译/签名/xref,
# 替代人工 grep decompiled.c。
#
# 启用前提 (一次性):
#  1. 扩展已装: D:\ghidra_12.1.3_PUBLIC\Extensions\Ghidra\GhidraMCP\
#     (若未生效, 在 Ghidra 里 File > Install Extensions 勾选并重启)
#  2. CodeBrowser 中 File > Configure > Configure All Plugins > GhidraMCP 启用,
#     打开 PECMD 项目后 bridge 默认监听 http://localhost:8080
#  3. python bridge 已 pip 安装: Scripts\bridge-mcp-ghidra.exe
#
# 未开 Ghidra 时此 server 会启动成功但所有调用失败 — 可临时注释掉本条目,
# 或给该条目加 failOnStartupError: false (默认即 false, 不阻塞其余插件)。
- id: mcp-ghidra
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: ghidra
    transport: stdio
    command: 'C:\Users\Administrator\AppData\Local\Programs\Python\Python314\Scripts\bridge-mcp-ghidra.exe'
